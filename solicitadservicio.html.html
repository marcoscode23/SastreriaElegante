<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitar Cita - Sastrería Elegante</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<header>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

      <a class="navbar-brand fw-bold" href="index.html">
        SASTRERÍA ELEGANTE
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Inicio</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="servicios.html">Servicios</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="galeria.html">Galería</a>
          </li>

          <li class="nav-item">
            <a class="nav-link active" href="contacto.html">Solicitar Cita</a>
          </li>
        </ul>
      </div>

    </div>
  </nav>
</header>

<main>

  <section class="bg-light py-5 text-center">
    <div class="container">
      <h1 class="fw-bold">Solicitar una Cita</h1>
      <p class="lead">
        Complete el formulario para reservar una atención personalizada.
      </p>
    </div>
  </section>

  <section class="container my-5">

    <div class="row justify-content-center">

      <div class="col-lg-8">

        <form class="card shadow p-4">

          <div class="mb-3">
            <label for="nombre" class="form-label">
              Nombre completo
            </label>

            <input
              type="text"
              class="form-control"
              id="nombre"
              placeholder="Ingrese su nombre"
              required
            >
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">
              Correo electrónico
            </label>

            <input
              type="email"
              class="form-control"
              id="email"
              placeholder="ejemplo@email.com"
              required
            >
          </div>

          <div class="mb-3">
            <label for="edad" class="form-label">
              Edad
            </label>

            <input
              type="number"
              class="form-control"
              id="edad"
              min="16"
              max="99"
              required
            >
          </div>

          <div class="mb-3">
            <label for="telefono" class="form-label">
              Teléfono
            </label>

            <input
              type="tel"
              class="form-control"
              id="telefono"
              placeholder="3794-000000"
            >
          </div>

          <div class="mb-3">
            <label for="servicio" class="form-label">
              Servicio solicitado
            </label>

            <select class="form-select" id="servicio" required>
              <option value="">
                Seleccionar...
              </option>

              <option>
                Traje a medida
              </option>

              <option>
                Arreglo de prendas
              </option>

              <option>
                Camisa personalizada
              </option>

              <option>
                Saco sport
              </option>
            </select>
          </div>

          <div class="mb-3">
            <label for="fecha" class="form-label">
              Fecha deseada
            </label>

            <input
              type="date"
              class="form-control"
              id="fecha"
            >
          </div>

          <div class="mb-3">
            <label for="comentarios" class="form-label">
              Comentarios
            </label>

            <textarea
              class="form-control"
              id="comentarios"
              rows="4"
              placeholder="Escriba detalles adicionales"
            ></textarea>
          </div>

          <div class="form-check mb-4">

            <input
              class="form-check-input"
              type="checkbox"
              id="acepto"
              required
            >

            <label class="form-check-label" for="acepto">
              Acepto ser contactado por la sastrería.
            </label>

          </div>

          <button type="submit" class="btn btn-dark w-100">
            Enviar Solicitud
          </button>

        </form>

      </div>

    </div>

  </section>

</main>

<footer class="bg-black text-white text-center py-3">
  <p class="mb-0">
  </p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
